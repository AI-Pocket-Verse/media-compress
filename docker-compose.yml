services:
  media-compress:
    build: .
    image: media-compress:local
    restart: unless-stopped
    ports:
      # Bound to this machine only. For LAN access use "8080:4010" and put this
      # machine's LAN IP or domain in ALLOWED_HOSTS below.
      - "127.0.0.1:8080:4010"
    environment:
      # Extra host names allowed in local mode (comma-separated, without port)
      ALLOWED_HOSTS: ""
      # Optional; see api/.env.example for all settings
      # WORKER_COUNT: "1"
      # MAX_UPLOAD_BYTES: "2147483648"
    volumes:
      - media-compress-data:/data

volumes:
  media-compress-data:
